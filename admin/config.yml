backend:
  name: git-gateway
  branch: main

media_folder: "imagenes/propiedades"
public_folder: "/imagenes/propiedades"

locale: 'es'

site_url: https://proterra-realestate.netlify.app
display_url: https://proterra-realestate.netlify.app
logo_url: https://proterra-realestate.netlify.app/imagenes/logo-proterra.jpg

collections:
  - name: "propiedades"
    label: "Propiedades"
    label_singular: "Propiedad"
    folder: "_propiedades"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{titulo}} — {{precio}}"
    sortable_fields: ['titulo', 'precio', 'categoria']
    fields:
      - label: "ID único (número)"
        name: "id"
        widget: "number"
        value_type: "int"
        min: 1
        hint: "Número único para cada propiedad. Si es nueva, usa el siguiente número disponible."

      - label: "Título de la propiedad"
        name: "titulo"
        widget: "string"
        hint: "Ej: Casa Moderna en Cayalá"

      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "🏡 Casa", value: "casa" }
          - { label: "🏢 Apartamento", value: "apartamento" }
          - { label: "💼 Oficina", value: "oficina" }
          - { label: "📦 Bodega", value: "bodega" }
          - { label: "🌳 Terreno", value: "terreno" }

      - label: "Estado / Etiqueta"
        name: "badge"
        widget: "select"
        options: ["En Venta", "En Alquiler", "Nuevo", "Exclusivo", "Disponible", "Inversión", "Reservada", "Vendida"]

      - label: "Ubicación"
        name: "ubicacion"
        widget: "string"
        hint: "Ej: Zona 16, Ciudad de Guatemala"

      - label: "Precio"
        name: "precio"
        widget: "string"
        hint: "Ej: $320,000 o $1,800/mes"

      - label: "Habitaciones"
        name: "habitaciones"
        widget: "string"
        required: false
        default: ""
        hint: "Déjalo vacío si no aplica"

      - label: "Baños"
        name: "banos"
        widget: "string"
        required: false
        default: ""

      - label: "Área"
        name: "area"
        widget: "string"
        required: false
        default: ""
        hint: "Ej: 320 m² o 1,500 m² construidos"

      - label: "Parqueos"
        name: "parqueos"
        widget: "string"
        required: false
        default: ""

      - label: "Niveles"
        name: "niveles"
        widget: "string"
        required: false
        default: ""

      - label: "Descripción"
        name: "descripcion"
        widget: "text"
        hint: "Describe la propiedad en 2-4 líneas"

      - label: "Foto Principal (Portada)"
        name: "imagenPrincipal"
        widget: "image"
        hint: "La foto que aparece como portada"

      - label: "Galería de Fotos"
        name: "galeria"
        widget: "list"
        summary: "Foto"
        required: false
        field: { label: "Foto", name: "image", widget: "image" }
        hint: "Agrega cuantas fotos quieras"

      - label: "Video (opcional)"
        name: "video"
        widget: "string"
        required: false
        default: ""
        hint: "Link de YouTube o archivo .mp4. Vacío si no hay video."
